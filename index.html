<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4 Simulations · Énergie Hydraulique Renouvelable</title>
<style>
  html,body{height:100%}
  body{margin:0;font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    background:radial-gradient(1200px 700px at 15% -10%,#14304a 0%,#08111c 55%,#04080d 100%);
    color:#dbe7f3;-webkit-font-smoothing:antialiased;min-height:100vh}
  .shell{max-width:1600px;margin:0 auto;padding:16px 20px 24px}
  .shell-header{display:flex;align-items:center;gap:14px;margin-bottom:16px}
  .shell-header .logo{width:48px;height:48px;display:grid;place-items:center;border-radius:14px;
    background:linear-gradient(150deg,#12384f,#0b1d2c);border:1px solid #2b5270;font-size:24px;
    box-shadow:0 0 26px rgba(95,208,255,.22)}
  .shell-header h1{margin:0;font-size:19px;letter-spacing:.2px;font-weight:700}
  .shell-header p{margin:3px 0 0;font-size:12.5px;color:#7d9ab3}
  .tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .tab{padding:11px 18px;border-radius:12px;border:1px solid #1f3a52;background:#0b1725;
    color:#7d9ab3;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;
    transition:all .18s ease;display:flex;align-items:center;gap:8px}
  .tab:hover{border-color:#2e5c7d;color:#dbe7f3;transform:translateY(-1px)}
  .tab.active{background:linear-gradient(180deg,#12384f,#0d2537);border-color:#5fd0ff;
    color:#5fd0ff;box-shadow:0 0 22px rgba(95,208,255,.25),inset 0 0 14px rgba(95,208,255,.06)}
  .tab .num{display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;
    border-radius:7px;background:rgba(95,208,255,.15);font-size:11px;font-weight:800}
  .tab.active .num{background:#5fd0ff;color:#04121c}
  .frames{position:relative}
  .sim-frame{width:100%;border:0;display:block;height:calc(100vh - 180px);min-height:860px;
    background:#04080d;border-radius:18px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.55)}
  .sim-frame[hidden]{display:none}
  @media(max-width:900px){.sim-frame{min-height:1500px}}
</style>
</head>
<body>
  <div class="shell">
    <header class="shell-header">
      <div class="logo">⚡</div>
      <div>
        <h1>Énergie Hydraulique Renouvelable · 4 Simulations Interactives</h1>
        <p>STEP réversible · Bélier hydraulique · Double réseau avec pompe · Double réseau avec bélier (sans pompe)</p>
      </div>
    </header>
    <nav class="tabs" id="tabs">
      <button class="tab active" data-tab="0"><span class="num">1</span>STEP réversible</button>
      <button class="tab" data-tab="1"><span class="num">2</span>Bélier hydraulique</button>
      <button class="tab" data-tab="2"><span class="num">3</span>Double réseau + pompe</button>
      <button class="tab" data-tab="3"><span class="num">4</span>Double réseau + bélier</button>
    </nav>
    <div class="frames" id="frames"></div>
  </div>

        <aside class="panel">
          <div class="card">
            <h2>Mode de fonctionnement</h2>
            <div class="modes">
              <button class="mode-btn active" data-mode="turbine"><span class="ico">⚡</span> Turbinage</button>
              <button class="mode-btn" data-mode="pump"><span class="ico">⬆</span> Pompage</button>
              <button class="mode-btn wide" data-mode="idle"><span class="ico">⏸</span> Arrêt</button>
            </div>
            <label class="switch"><input type="checkbox" id="auto"><span>Cycle automatique (turbine ⇄ pompe)</span></label>
          </div>
          <div class="card">
            <h2>Ouverture de la vanne</h2>
            <input type="range" id="opening" min="0" max="100" value="60">
            <div class="range-row"><span>Fermée</span><b id="openingVal">60 %</b><span>Ouverte</span></div>
          </div>
          <div class="card">
            <h2>Mesures instantanées</h2>
            <div class="stats">
              <div class="stat"><span>Chute nette</span><b id="sHead">0 m</b></div>
              <div class="stat"><span>Débit</span><b id="sFlow">0 m³/s</b></div>
              <div class="stat hl" id="powerBox"><span>Puissance</span><b id="sPower">0 MW</b></div>
              <div class="stat hl"><span>Énergie</span><b id="sEnergy">0 MWh</b></div>
            </div>
          </div>
          <div class="card">
            <h2>Niveaux des réservoirs</h2>
            <div class="level"><div class="level-head"><span>▲ Réservoir amont</span><b id="lvUp">80 %</b></div><div class="bar"><i id="barUp" style="width:80%"></i></div></div>
            <div class="level"><div class="level-head"><span>▼ Réservoir aval</span><b id="lvDown">15 %</b></div><div class="bar down"><i id="barDown" style="width:15%"></i></div></div>
            <div class="simtime"><span>Temps simulé</span><b id="sTime">00:00</b></div>
          </div>
          <button class="reset" id="reset">↺ Réinitialiser la simulation</button>
        </aside>
      </div>
    </div>
    <script>
    (function(){
      "use strict";
      const CAP_UP=800000,CAP_DOWN=1200000,CV=6,ETA_T=.90,ETA_P=.85,TIME_SCALE=200,G=9.81;
      const initial=()=>({levelUp:80,levelDown:15,mode:'turbine',opening:60,energy:0,simTime:0,head:0,q:0,power:0,auto:false,rot:0,flow:0,cable:0});
      let S=initial();
      const $=id=>document.getElementById(id);
      const el={waterUp:$('waterUp'),waterDown:$('waterDown'),flowLine:$('flowLine'),cableFlow:$('cableFlow'),rotor:$('rotor'),
        sHead:$('sHead'),sFlow:$('sFlow'),sPower:$('sPower'),sEnergy:$('sEnergy'),lvUp:$('lvUp'),lvDown:$('lvDown'),
        barUp:$('barUp'),barDown:$('barDown'),sTime:$('sTime'),powerBox:$('powerBox'),opening:$('opening'),
        openingVal:$('openingVal'),auto:$('auto')};
      const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
      const fmtTime=s=>{const h=Math.floor(s/3600),m=Math.floor((s%3600)/60);return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');};
      function step(dt){
        const head=Math.max(0,30+S.levelUp*1.1-S.levelDown*0.3); S.head=head;
        const of=S.opening/100; let q=0,power=0;
        if(S.mode==='turbine'&&of>0&&S.levelUp>0.2){q=CV*of*Math.sqrt(head);power=G*q*head*ETA_T/1000;}
        else if(S.mode==='pump'&&of>0&&S.levelDown>0.2&&S.levelUp<100){q=CV*0.8*of*Math.sqrt(head);power=-(G*q*head/ETA_P/1000);}
        const dtSim=dt*TIME_SCALE,dV=q*dtSim;
        if(q>0){
          if(S.mode==='turbine'){S.levelUp-=dV/CAP_UP*100;S.levelDown+=dV/CAP_DOWN*100;}
          else if(S.mode==='pump'){S.levelUp+=dV/CAP_UP*100;S.levelDown-=dV/CAP_DOWN*100;}
        }
        S.levelUp=clamp(S.levelUp,0,100);S.levelDown=clamp(S.levelDown,0,100);
        if(power>0)S.energy+=power*dtSim/3600;
        S.simTime+=dtSim;S.q=q;S.power=power;
        if(S.auto){
          if(S.mode==='turbine'&&S.levelUp<=6)setMode('pump');
          else if(S.mode==='pump'&&S.levelUp>=94)setMode('turbine');
        }
      }
      function render(dt){
        const hUp=S.levelUp/100*130;
        el.waterUp.setAttribute('y',209-hUp);el.waterUp.setAttribute('height',Math.max(0,hUp));
        const hDown=8+S.levelDown/100*50;
        el.waterDown.setAttribute('y',680-hDown);el.waterDown.setAttribute('height',hDown);
        const dir=(S.mode==='pump')?-1:1,spin=Math.min(420,S.q*3.4);
        S.rot+=dir*spin*dt;el.rotor.setAttribute('transform',`rotate(${S.rot.toFixed(2)} 588 540)`);
        const pipeDir=(S.mode==='pump')?1:-1;
        S.flow+=pipeDir*Math.min(160,S.q*1.7)*dt;
        el.flowLine.setAttribute('stroke-dashoffset',S.flow.toFixed(2));
        el.flowLine.setAttribute('opacity',S.q>0.3?0.95:0.12);
        const cSpeed=Math.min(95,Math.abs(S.power)*2.4);
        S.cable+=((S.mode==='pump')?1:-1)*cSpeed*dt;
        el.cableFlow.setAttribute('stroke-dashoffset',S.cable.toFixed(2));
        if(S.mode==='pump'&&S.q>0.3){el.cableFlow.setAttribute('stroke','#ffa94d');el.cableFlow.setAttribute('opacity',1);}
        else if(S.power>0.2){el.cableFlow.setAttribute('stroke','#42e39b');el.cableFlow.setAttribute('opacity',1);}
        else{el.cableFlow.setAttribute('opacity',0.18);}
        el.sHead.textContent=S.head.toFixed(1)+' m';
        el.sFlow.textContent=S.q.toFixed(1)+' m³/s';
        el.sPower.textContent=(S.power>=0?'+':'−')+Math.abs(S.power).toFixed(1)+' MW';
        el.sEnergy.textContent=S.energy.toFixed(1)+' MWh';
        el.powerBox.classList.toggle('warn',S.power<-0.2);
        el.sPower.style.color=S.power<-0.2?'var(--orange)':'var(--cyan)';
        el.lvUp.textContent=S.levelUp.toFixed(1)+' %';
        el.lvDown.textContent=S.levelDown.toFixed(1)+' %';
        el.barUp.style.width=S.levelUp+'%';
        el.barDown.style.width=S.levelDown+'%';
        el.sTime.textContent=fmtTime(S.simTime);
      }
      let last=0;
      function loop(now){
        if(!last)last=now;
        let dt=(now-last)/1000;last=now;dt=Math.min(dt,0.06);
        step(dt);render(dt);requestAnimationFrame(loop);
      }
      function setMode(mode){
        S.mode=mode;
        document.querySelectorAll('.mode-btn').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));
      }
      document.querySelectorAll('.mode-btn').forEach(btn=>{
        btn.addEventListener('click',()=>{
          if(btn.dataset.mode==='idle'){S.mode='idle';document.querySelectorAll('.mode-btn').forEach(b=>b.classList.toggle('active',b.dataset.mode==='idle'));}
          else setMode(btn.dataset.mode);
        });
      });
      el.opening.addEventListener('input',e=>{
        S.opening=+e.target.value;el.openingVal.textContent=S.opening+' %';
        e.target.style.background=`linear-gradient(90deg, var(--cyan) 0%, var(--cyan) ${S.opening}%, #16293a ${S.opening}%, #16293a 100%)`;
      });
      el.opening.dispatchEvent(new Event('input'));
      el.auto.addEventListener('change',e=>{S.auto=e.target.checked;if(S.auto&&S.mode==='idle')setMode('turbine');});
      $('reset').addEventListener('click',()=>{
        S=initial();last=0;setMode('turbine');el.auto.checked=false;
        el.opening.value=60;el.opening.dispatchEvent(new Event('input'));render(0);
      });
      requestAnimationFrame(loop);
    })();
    </script>
  </template>

              <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

    <script>
    (function(){
      "use strict";
      const CAP_UP=600000,CAP_DOWN=900000,Q_MAX=42,ETA=.22,PHASE_DUR=[0.65,0.14,0.48,0.36],TIME_SCALE=180;
      const initial=()=>({running:true,levelUp:85,levelDown:10,opening:65,speed:1,cycles:0,volPumped:0,volDrive:0,
        simTime:0,phase:0,phaseTime:0,pressure:.15,driveFlow:0,pumpFlow:0,wasteFlow:0,driveDash:0,deliveryDash:0,
        wasteDash:0,gaugeAngle:-50,wasteOpen:1,deliveryOpen:0,hammerFlash:0});
      let S=initial();
      const $=id=>document.getElementById(id);
      const D={waterUp:$('waterUp'),waterDown:$('waterDown'),surfaceUp:$('surfaceUp'),surfaceDown:$('surfaceDown'),
        driveFlow:$('driveFlow'),deliveryFlow:$('deliveryFlow'),wasteFlow:$('wasteFlow'),pumpWater:$('pumpWater'),
        wasteFlap:$('wasteFlap'),deliveryBall:$('deliveryBall'),gaugeNeedle:$('gaugeNeedle'),airLevel:$('airLevel'),
        phaseLabel:$('phaseLabel'),sDrive:$('sDrive'),sPump:$('sPump'),sPress:$('sPress'),sCycles:$('sCycles'),
        sEff:$('sEff'),sVol:$('sVol'),lvUp:$('lvUp'),lvDown:$('lvDown'),barUp:$('barUp'),barDown:$('barDown'),
        sTime:$('sTime'),opening:$('opening'),openingVal:$('openingVal'),speed:$('speed'),speedVal:$('speedVal')};
      const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
      const lerp=(a,b,t)=>a+(b-a)*t;
      const fmtTime=s=>{const h=Math.floor(s/3600),m=Math.floor((s%3600)/60);return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');};
      function updatePhase(dt){
        S.phaseTime+=dt*S.speed;
        if(S.phaseTime>=PHASE_DUR[S.phase]){
          S.phaseTime-=PHASE_DUR[S.phase];S.phase=(S.phase+1)%4;
          if(S.phase===1){S.cycles++;S.hammerFlash=1;}
        }
      }
      function step(dt){
        if(!S.running){S.driveFlow*=.92;S.pumpFlow*=.92;S.wasteFlow*=.92;return;}
        const of=S.opening/100,headFactor=.4+S.levelUp/100*.6;
        const qDrive=Q_MAX*of*headFactor,qPump=qDrive*ETA,qWaste=qDrive*(1-ETA);
        S.driveFlow=lerp(S.driveFlow,qDrive,Math.min(1,dt*6));
        S.pumpFlow=lerp(S.pumpFlow,qPump,Math.min(1,dt*6));
        S.wasteFlow=lerp(S.wasteFlow,qWaste,Math.min(1,dt*6));
        const dtSim=dt*TIME_SCALE;
        const volDrive=qDrive*dtSim,volPump=qPump*dtSim,volWaste=qWaste*dtSim;
        const naturalIn=volDrive-volPump;
        S.levelUp+=(-volDrive+volPump+naturalIn)/CAP_UP*100;
        S.levelDown+=volWaste/CAP_DOWN*100;
        S.levelUp=clamp(S.levelUp,2,100);S.levelDown=clamp(S.levelDown,2,98);
        S.volDrive+=volDrive;S.volPumped+=volPump;S.simTime+=dtSim;
        updatePhase(dt);
        const tP=[.18,.92,.72,.32][S.phase];
        S.pressure=lerp(S.pressure,tP,Math.min(1,dt*18));
        const wT=[1,0,0,.55][S.phase],dT=[0,.75,1,0][S.phase];
        S.wasteOpen=lerp(S.wasteOpen,wT,Math.min(1,dt*22));
        S.deliveryOpen=lerp(S.deliveryOpen,dT,Math.min(1,dt*22));
        S.hammerFlash*=.88;
      }
      function render(dt){
        const hUp=S.levelUp/100*152;
        D.waterUp.setAttribute('y',200-hUp);D.waterUp.setAttribute('height',Math.max(0,hUp));
        D.surfaceUp.setAttribute('y1',200-hUp);D.surfaceUp.setAttribute('y2',200-hUp);
        const hDown=8+S.levelDown/100*104;
        D.waterDown.setAttribute('y',706-hDown);D.waterDown.setAttribute('height',hDown);
        D.surfaceDown.setAttribute('y1',706-hDown);D.surfaceDown.setAttribute('y2',706-hDown);
        const driveSpeed=S.running?S.driveFlow*2.2:0,pumpSpeed=S.running?S.pumpFlow*3.4:0,wasteSpeed=S.running?S.wasteFlow*2.6:0;
        S.driveDash-=driveSpeed*dt*60;S.deliveryDash-=pumpSpeed*dt*60;S.wasteDash-=wasteSpeed*dt*60;
        D.driveFlow.setAttribute('stroke-dashoffset',S.driveDash.toFixed(1));
        D.deliveryFlow.setAttribute('stroke-dashoffset',S.deliveryDash.toFixed(1));
        D.wasteFlow.setAttribute('stroke-dashoffset',S.wasteDash.toFixed(1));
        D.driveFlow.setAttribute('opacity',S.running?clamp(.3+S.driveFlow/30,.2,1):.15);
        D.deliveryFlow.setAttribute('opacity',S.running?clamp(.2+S.pumpFlow/12,.15,1):.1);
        D.wasteFlow.setAttribute('opacity',S.running?clamp(.2+S.wasteFlow/30,.15,1):.1);
        const ph=90*(.55+S.pressure*.5);
        D.pumpWater.setAttribute('height',ph.toFixed(1));
        D.pumpWater.setAttribute('y',(620-ph).toFixed(1));
        D.pumpWater.setAttribute('opacity',(.35+S.pressure*.45).toFixed(2));
        D.wasteFlap.setAttribute('transform',`rotate(${(S.wasteOpen*38).toFixed(1)} 202 631)`);
        D.deliveryBall.setAttribute('cy',(522-S.deliveryOpen*9).toFixed(1));
        D.deliveryBall.setAttribute('fill',S.deliveryOpen>.5?'#42e39b':'url(#metalLight)');
        const targetAngle=-50+S.pressure*100;
        S.gaugeAngle=lerp(S.gaugeAngle,targetAngle,Math.min(1,dt*14));
        D.gaugeNeedle.setAttribute('transform',`rotate(${S.gaugeAngle.toFixed(1)} 320 462)`);
        D.airLevel.setAttribute('y',(470+(1-S.pressure)*20).toFixed(1));
        const phaseNames=['ACCÉLÉRATION','COUP DE BÉLIER','REFOULEMENT','DÉTENTE'];
        const phaseColors=['#5fd0ff','#ffa94d','#42e39b','#7d9ab3'];
        D.phaseLabel.textContent=phaseNames[S.phase];
        D.phaseLabel.setAttribute('fill',phaseColors[S.phase]);
        D.phaseLabel.setAttribute('opacity',S.hammerFlash>.02?(.4+S.hammerFlash*.6).toFixed(2):'1');
        D.sDrive.textContent=S.driveFlow.toFixed(1)+' L/s';
        D.sPump.textContent=S.pumpFlow.toFixed(1)+' L/s';
        D.sPress.textContent=(S.pressure*6).toFixed(1)+' bar';
        D.sCycles.textContent=S.cycles;
        D.sVol.textContent=(S.volPumped/1000).toFixed(1)+' m³';
        const eff=S.volDrive>0?(S.volPumped/S.volDrive*100):0;
        D.sEff.textContent=eff.toFixed(1)+' %';
        D.lvUp.textContent=S.levelUp.toFixed(1)+' %';
        D.lvDown.textContent=S.levelDown.toFixed(1)+' %';
        D.barUp.style.width=S.levelUp+'%';D.barDown.style.width=S.levelDown+'%';
        D.sTime.textContent=fmtTime(S.simTime);
      }
      let last=0;
      function loop(now){
        if(!last)last=now;let dt=(now-last)/1000;last=now;dt=Math.min(dt,0.06);
        step(dt);render(dt);requestAnimationFrame(loop);
      }
      $('btnRun').addEventListener('click',()=>{S.running=true;$('btnRun').classList.add('active');$('btnStop').classList.remove('active');});
      $('btnStop').addEventListener('click',()=>{S.running=false;$('btnStop').classList.add('active');$('btnRun').classList.remove('active');});
      D.opening.addEventListener('input',e=>{
        S.opening=+e.target.value;D.openingVal.textContent=S.opening+' %';
        const pct=S.opening;
        e.target.style.background=`linear-gradient(90deg, var(--cyan) 0%, var(--cyan) ${pct}%, #16293a ${pct}%, #16293a 100%)`;
      });
      D.opening.dispatchEvent(new Event('input'));
      D.speed.addEventListener('input',e=>{
        S.speed=+e.target.value;D.speedVal.textContent=S.speed.toFixed(1)+'×';
        const pct=(S.speed-.2)/2.3*100;
        e.target.style.background=`linear-gradient(90deg, var(--cyan) 0%, var(--cyan) ${pct}%, #16293a ${pct}%, #16293a 100%)`;
      });
      D.speed.dispatchEvent(new Event('input'));
      $('reset').addEventListener('click',()=>{
        S=initial();last=0;$('btnRun').classList.add('active');$('btnStop').classList.remove('active');
        D.opening.value=65;D.opening.dispatchEvent(new Event('input'));
        D.speed.value=1;D.speed.dispatchEvent(new Event('input'));render(0);
      });
      requestAnimationFrame(loop);
    })();
    </script>

    (function(){

      const Q_MAX=5000,K_GRAV=1200,H_RES=20,ETA_PUMP=.85,ETA_TURB=.88,DH_MAX=18,TIME_SCALE=180,BASE_LEVEL=60;
      const initial=()=>({running:true,pumpSpeed:60,levelA:BASE_LEVEL,levelB:BASE_LEVEL,dh:0,dhTarget:0,
        qPump:0,qGrav:0,q:0,volExchanged:0,simTime:0,flowTopDash:0,flowBotDash:0,rotPump:0,rotTurb:0});
      let S=initial();
      const $=id=>document.getElementById(id);
      const D={waterA:$('waterA'),waterB:$('waterB'),surfA:$('surfA'),surfB:$('surfB'),flowTop:$('flowTop'),
        flowBot:$('flowBot'),rotorPump:$('rotorPump'),rotorTurb:$('rotorTurb'),badgeA:$('badgeA'),badgeB:$('badgeB'),
        sFlow:$('sFlow'),sDh:$('sDh'),sPump:$('sPump'),sTurb:$('sTurb'),sEff:$('sEff'),sVol:$('sVol'),
        lvA:$('lvA'),lvB:$('lvB'),barA:$('barA'),barB:$('barB'),sTime:$('sTime'),
        pumpSpeed:$('pumpSpeed'),pumpSpeedVal:$('pumpSpeedVal')};
      const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
      const lerp=(a,b,t)=>a+(b-a)*t;
      const fmtTime=s=>{const h=Math.floor(s/3600),m=Math.floor((s%3600)/60);return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');};
      function step(dt){
        if(!S.running){S.qPump*=.9;S.qGrav*=.9;S.q=0;return;}
        S.qPump=S.pumpSpeed/100*Q_MAX;
        S.dhTarget=Math.min(DH_MAX,Math.pow(S.qPump/K_GRAV,2));
        S.dh=lerp(S.dh,S.dhTarget,Math.min(1,dt*0.9));
        S.qGrav=K_GRAV*Math.sqrt(Math.max(0,S.dh));
        S.q=(S.qPump+S.qGrav)/2;
        S.levelA=BASE_LEVEL+S.dh/2;
        S.levelB=BASE_LEVEL-S.dh/2;
        const dtSim=dt*TIME_SCALE;
        S.volExchanged+=S.q*dtSim/1000;
        S.simTime+=dtSim;
      }
      function render(dt){
        const hA=S.levelA/100*232;
        D.waterA.setAttribute('y',466-hA);D.waterA.setAttribute('height',Math.max(0,hA));
        D.surfA.setAttribute('y1',466-hA);D.surfA.setAttribute('y2',466-hA);
        const hB=S.levelB/100*232;
        D.waterB.setAttribute('y',466-hB);D.waterB.setAttribute('height',Math.max(0,hB));
        D.surfB.setAttribute('y1',466-hB);D.surfB.setAttribute('y2',466-hB);
        S.flowTopDash-=S.qGrav*0.09*dt*60;
        S.flowBotDash+=S.qPump*0.09*dt*60;
        D.flowTop.setAttribute('stroke-dashoffset',S.flowTopDash.toFixed(1));
        D.flowBot.setAttribute('stroke-dashoffset',S.flowBotDash.toFixed(1));
        D.flowTop.setAttribute('opacity',clamp(.15+S.qGrav/2500,.15,1));
        D.flowBot.setAttribute('opacity',clamp(.15+S.qPump/2500,.15,1));
        S.rotPump+=S.pumpSpeed/100*720*dt;
        S.rotTurb+=Math.min(520,S.qGrav/8)*dt;
        D.rotorPump.setAttribute('transform',`rotate(${S.rotPump.toFixed(1)} 450 599)`);
        D.rotorTurb.setAttribute('transform',`rotate(${S.rotTurb.toFixed(1)} 450 339)`);
        D.badgeA.textContent=S.levelA.toFixed(1)+' %';
        D.badgeB.textContent=S.levelB.toFixed(1)+' %';
        D.badgeA.setAttribute('fill',S.dh>.5?'#42e39b':'#5fd0ff');
        D.badgeB.setAttribute('fill',S.dh>.5?'#ffa94d':'#5fd0ff');
        D.sFlow.textContent=S.q.toFixed(0)+' L/s';
        D.sDh.textContent=S.dh.toFixed(1)+' %';
        const dh_m=S.dh/100*H_RES;
        const pPump=9.81*(S.qPump/1000)*dh_m/ETA_PUMP;
        const pTurb=9.81*(S.qGrav/1000)*dh_m*ETA_TURB;
        D.sPump.textContent=pPump.toFixed(2)+' kW';
        D.sTurb.textContent=pTurb.toFixed(2)+' kW';
        D.sEff.textContent=(pPump>.01?(pTurb/pPump*100):0).toFixed(1)+' %';
        D.sVol.textContent=S.volExchanged.toFixed(1)+' m³';
        D.lvA.textContent=S.levelA.toFixed(1)+' %';
        D.lvB.textContent=S.levelB.toFixed(1)+' %';
        D.barA.style.width=S.levelA+'%';D.barB.style.width=S.levelB+'%';
        D.sTime.textContent=fmtTime(S.simTime);
      }
      let last=0;
      function loop(now){
        if(!last)last=now;let dt=(now-last)/1000;last=now;dt=Math.min(dt,0.06);
        step(dt);render(dt);requestAnimationFrame(loop);
      }
      $('btnRun').addEventListener('click',()=>{S.running=true;$('btnRun').classList.add('active');$('btnStop').classList.remove('active');});
      $('btnStop').addEventListener('click',()=>{S.running=false;$('btnStop').classList.add('active');$('btnRun').classList.remove('active');});
      D.pumpSpeed.addEventListener('input',e=>{
        S.pumpSpeed=+e.target.value;D.pumpSpeedVal.textContent=S.pumpSpeed+' %';
        const pct=S.pumpSpeed;
        e.target.style.background=`linear-gradient(90deg, var(--cyan) 0%, var(--cyan) ${pct}%, #16293a ${pct}%, #16293a 100%)`;
      });
      D.pumpSpeed.dispatchEvent(new Event('input'));
      $('reset').addEventListener('click',()=>{
        S=initial();last=0;$('btnRun').classList.add('active');$('btnStop').classList.remove('active');
        D.pumpSpeed.value=60;D.pumpSpeed.dispatchEvent(new Event('input'));render(0);
      });
      requestAnimationFrame(loop);
    })();
    </script>

            <div class="level"><div class="level-head"><span>▼ Réservoir B (source)</span><b id="lvB">50.0 %</b></div><div class="bar right"><i id="barB" style="width:50%"></i></div></div>

          </div>
          <div class="info">
            <span class="ic">SANS POMPE</span>
            Aucune pompe électrique. Le réseau <b>supérieur</b> fait circuler l'eau de A vers B par gravité (turbine = énergie). Le réseau <b>inférieur</b> utilise un <b>bélier hydraulique</b> : l'eau de B descend, un clapet se ferme brutalement (coup de bélier), la surpression ouvre le clapet de refoulement et pousse une partie de l'eau <b>plus haut que sa source</b>, jusqu'à A.

    <script>
    (function(){
      "use strict";
      const K_UPPER=950,K_RAM=420,ETA_RAM=.32,H_RES=20,ETA_TURB=.88,TIME_SCALE=90,CAP=4000000,MIN_LEVEL=4;
      const initial=()=>({running:true,driveOpening:70,levelA:70,levelB:50,qTop:0,qPump:0,qWaste:0,dh:0,pressure:.15,
        simTime:0,flowTopDash:0,flowBotDash:0,rotTurb:0,wasteOpen:1,deliveryOpen:0,hammerFlash:0,
        ramPhase:0,ramPhaseTime:0,energy:0,pTurb:0});
      let S=initial();
      const $=id=>document.getElementById(id);
      const D={waterA:$('waterA'),waterB:$('waterB'),surfA:$('surfA'),surfB:$('surfB'),flowTop:$('flowTop'),
        flowBot:$('flowBot'),rotorTurb:$('rotorTurb'),ramWater:$('ramWater'),airLevel:$('airLevel'),
        gaugeNeedle:$('gaugeNeedle'),wasteFlap:$('wasteFlap'),deliveryBall:$('deliveryBall'),
        badgeA:$('badgeA'),badgeB:$('badgeB'),sQTop:$('sQTop'),sQPump:$('sQPump'),sDh:$('sDh'),
        sQWaste:$('sQWaste'),sTurb:$('sTurb'),sEff:$('sEff'),lvA:$('lvA'),lvB:$('lvB'),
        barA:$('barA'),barB:$('barB'),sTime:$('sTime'),
        driveOpening:$('driveOpening'),driveVal:$('driveVal')};
      const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
      const lerp=(a,b,t)=>a+(b-a)*t;
      const fmtTime=s=>{const h=Math.floor(s/3600),m=Math.floor((s%3600)/60);return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');};
      const RAM_PHASES=[0.62,0.14,0.50,0.38];
      function updateRamCycle(dt){
        S.ramPhaseTime+=dt*(0.6+S.driveOpening/100*1.4);
        if(S.ramPhaseTime>=RAM_PHASES[S.ramPhase]){
          S.ramPhaseTime-=RAM_PHASES[S.ramPhase];S.ramPhase=(S.ramPhase+1)%4;
          if(S.ramPhase===1)S.hammerFlash=1;
        }
      }
      function step(dt){
        if(!S.running){S.qTop*=.9;S.qPump*=.9;S.qWaste*=.9;return;}
        const dhTop=Math.max(0,S.levelA-S.levelB);
        S.qTop=K_UPPER*Math.sqrt(dhTop);
        const dhRam=Math.max(0,S.levelB-MIN_LEVEL);
        const qDrive=K_RAM*(S.driveOpening/100)*Math.sqrt(dhRam);
        S.qPump=qDrive*ETA_RAM;S.qWaste=qDrive*(1-ETA_RAM);
        const dtSim=dt*TIME_SCALE;
        S.levelA+=(S.qPump-S.qTop)*dtSim/CAP*100;
        S.levelB+=(S.qTop-S.qPump)*dtSim/CAP*100;
        S.levelA=clamp(S.levelA,0,100);S.levelB=clamp(S.levelB,0,100);
        S.dh=S.levelA-S.levelB;S.simTime+=dtSim;
        const headTop=dhTop/100*H_RES;
        S.pTurb=9.81*(S.qTop/1000)*headTop*ETA_TURB;
        if(S.pTurb>0)S.energy+=S.pTurb*dtSim/3600;
        updateRamCycle(dt);
        const targetP=[.18,.92,.72,.32][S.ramPhase];
        S.pressure=lerp(S.pressure,targetP,Math.min(1,dt*16));
        const wT=[1,0,0,.55][S.ramPhase],dT=[0,.8,1,0][S.ramPhase];
        S.wasteOpen=lerp(S.wasteOpen,wT,Math.min(1,dt*20));
        S.deliveryOpen=lerp(S.deliveryOpen,dT,Math.min(1,dt*20));
        S.hammerFlash*=.88;
      }
      function render(dt){
        const hA=S.levelA/100*252;
        D.waterA.setAttribute('y',466-hA);D.waterA.setAttribute('height',Math.max(0,hA));
        D.surfA.setAttribute('y1',466-hA);D.surfA.setAttribute('y2',466-hA);
        const hB=S.levelB/100*252;
        D.waterB.setAttribute('y',466-hB);D.waterB.setAttribute('height',Math.max(0,hB));
        D.surfB.setAttribute('y1',466-hB);D.surfB.setAttribute('y2',466-hB);
        S.flowTopDash-=S.qTop*0.09*dt*60;
        S.flowBotDash+=S.qPump*0.09*dt*60;
        D.flowTop.setAttribute('stroke-dashoffset',S.flowTopDash.toFixed(1));
        D.flowBot.setAttribute('stroke-dashoffset',S.flowBotDash.toFixed(1));
        D.flowTop.setAttribute('opacity',clamp(.15+S.qTop/2500,.15,1));
        D.flowBot.setAttribute('opacity',clamp(.15+S.qPump/800,.15,1));
        S.rotTurb+=Math.min(520,S.qTop/8)*dt;
        D.rotorTurb.setAttribute('transform',`rotate(${S.rotTurb.toFixed(1)} 450 340)`);
        const ph=46*(.55+S.pressure*.5);
        D.ramWater.setAttribute('height',ph.toFixed(1));
        D.ramWater.setAttribute('y',(644-ph).toFixed(1));
        D.ramWater.setAttribute('opacity',(.35+S.pressure*.5).toFixed(2));
        D.wasteFlap.setAttribute('transform',`rotate(${(S.wasteOpen*38).toFixed(1)} 443 669)`);
        D.deliveryBall.setAttribute('cy',(576-S.deliveryOpen*7).toFixed(1));
        D.deliveryBall.setAttribute('fill',S.deliveryOpen>.5?'#42e39b':'url(#metalLight)');
        const targetAngle=-50+S.pressure*100;
        const currentAngle=parseFloat(D.gaugeNeedle.getAttribute('data-angle')||'0');
        const newAngle=lerp(currentAngle,targetAngle,Math.min(1,dt*14));
        D.gaugeNeedle.setAttribute('data-angle',newAngle);
        D.gaugeNeedle.setAttribute('transform',`rotate(${newAngle.toFixed(1)} 450 524)`);
        D.airLevel.setAttribute('y',(530+(1-S.pressure)*20).toFixed(1));
        D.badgeA.textContent=S.levelA.toFixed(1)+' %';
        D.badgeB.textContent=S.levelB.toFixed(1)+' %';
        D.badgeA.setAttribute('fill',S.dh>.5?'#42e39b':'#5fd0ff');
        D.badgeB.setAttribute('fill',S.dh>.5?'#ffa94d':'#5fd0ff');
        D.sQTop.textContent=S.qTop.toFixed(0)+' L/s';
        D.sQPump.textContent=S.qPump.toFixed(0)+' L/s';
        D.sDh.textContent=S.dh.toFixed(1)+' %';
        D.sQWaste.textContent=S.qWaste.toFixed(0)+' L/s';
        D.sTurb.textContent=(S.pTurb||0).toFixed(2)+' kW';
        D.sEff.textContent=(S.qTop>.5?(S.qPump/S.qTop*100):0).toFixed(1)+' %';
        D.lvA.textContent=S.levelA.toFixed(1)+' %';
        D.lvB.textContent=S.levelB.toFixed(1)+' %';
        D.barA.style.width=S.levelA+'%';D.barB.style.width=S.levelB+'%';
        D.sTime.textContent=fmtTime(S.simTime);
      }
      let last=0;
      function loop(now){
        if(!last)last=now;let dt=(now-last)/1000;last=now;dt=Math.min(dt,0.06);
        step(dt);render(dt);requestAnimationFrame(loop);
      }
      $('btnRun').addEventListener('click',()=>{S.running=true;$('btnRun').classList.add('active');$('btnStop').classList.remove('active');});
      $('btnStop').addEventListener('click',()=>{S.running=false;$('btnStop').classList.add('active');$('btnRun').classList.remove('active');});
      D.driveOpening.addEventListener('input',e=>{
        S.driveOpening=+e.target.value;D.driveVal.textContent=S.driveOpening+' %';
        const pct=S.driveOpening;
        e.target.style.background=`linear-gradient(90deg, var(--cyan) 0%, var(--cyan) ${pct}%, #16293a ${pct}%, #16293a 100%)`;
      });
      D.driveOpening.dispatchEvent(new Event('input'));
      $('reset').addEventListener('click',()=>{
        S=initial();last=0;$('btnRun').classList.add('active');$('btnStop').classList.remove('active');
        D.driveOpening.value=70;D.driveOpening.dispatchEvent(new Event('input'));render(0);
      });
      requestAnimationFrame(loop);
    })();
    </script>
  </template>

    const frames = document.getElementById('frames');
    const iframes = [];

    for (let i = 0; i < 4; i++) {
      const tpl = document.getElementById('tpl-' + i);
      const content = tpl.innerHTML;
      const doc = '<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8">' +
                  '<style>' + BASE_CSS + '</style></head><body>' + content + '</body></html>';

      const iframe = document.createElement('iframe');
      iframe.className = 'sim-frame';
      iframe.title = 'Simulation ' + (i + 1);
      iframe.srcdoc = doc;
      if (i !== 0) iframe.hidden = true;
      frames.appendChild(iframe);
      iframes.push(iframe);
    }

    const tabs = document.querySelectorAll('.tab');
    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        const idx = +tab.dataset.tab;
        tabs.forEach(t => t.classList.toggle('active', t === tab));
        iframes.forEach((f, i) => { f.hidden = (i !== idx); });
      });
    });
  })();
  </script>
