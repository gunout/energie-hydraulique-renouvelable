<style>

  .frames{position:relative}
  .sim-frame{width:100%;border:0;display:block;height:calc(100vh - 180px);min-height:860px;
    background:#04080d;border-radius:18px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.55)}
  .sim-frame[hidden]{display:none}
  @media(max-width:900px){.sim-frame{min-height:1500px}}
</style>

              <div class="stat hl" id="powerBox"><span>Puissance</span><b id="sPower">0 MW</b></div>

    <script>
    (function(){
      "use strict";
      const CAP_UP=800000,CAP_DOWN=1200000,CV=6,ETA_T=.90,ETA_P=.85,TIME_SCALE=200,G=9.81;
      const initial=()=>({levelUp:80,levelDown:15,mode:'turbine',opening:60,energy:0,simTime:0,head:0,q:0,power:0,auto:false,rot:0,flow:0,cable:0});
      let S=initial();
      const $=id=>document.getElementById(id);
      const el={waterUp:$('waterUp'),waterDown:$('waterDown'),flowLine:$('flowLine'),cableFlow:$('cableFlow'),rotor:$('rotor'),
        sHead:$('sHead'),sFlow:$('sFlow'),sPower:$('sPower'),sEnergy:$('sEnergy'),lvUp:$('lvUp'),lvDown:$('lvDown'),
        barUp:$('barUp'),barDown:$('barDown'),sTime:$('sTime'),powerBox:$('powerBox'),opening:$('opening'),
        openingVal:$('openingVal'),auto:$('auto')};
      const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
      const fmtTime=s=>{const h=Math.floor(s/3600),m=Math.floor((s%3600)/60);return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');};
      function setMode(mode){
        S.mode=mode;
        document.querySelectorAll('.mode-btn').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));
      }
      function step(dt){
        const head=Math.max(0,30+S.levelUp*1.1-S.levelDown*0.3);S.head=head;
        const of=S.opening/100;let q=0,power=0;
        if(S.mode==='turbine'&&of>0&&S.levelUp>0.2){q=CV*of*Math.sqrt(head);power=G*q*head*ETA_T/1000;}
        else if(S.mode==='pump'&&of>0&&S.levelDown>0.2&&S.levelUp<100){q=CV*0.8*of*Math.sqrt(head);power=-(G*q*head/ETA_P/1000);}
        const dtSim=dt*TIME_SCALE,dV=q*dtSim;
        if(q>0){
          if(S.mode==='turbine'){S.levelUp-=dV/CAP_UP*100;S.levelDown+=dV/CAP_DOWN*100;}
          else if(S.mode==='pump'){S.levelUp+=dV/CAP_UP*100;S.levelDown-=dV/CAP_DOWN*100;}
        }
        S.levelUp=clamp(S.levelUp,0,100);S.levelDown=clamp(S.levelDown,0,100);
        if(power>0)S.energy+=power*dtSim/3600;
        S.simTime+=dtSim;S.q=q;S.power=power;
        if(S.auto){
          if(S.mode==='turbine'&&S.levelUp<=6)setMode('pump');
          else if(S.mode==='pump'&&S.levelUp>=94)setMode('turbine');
        }
      }
      function render(dt){
        const hUp=S.levelUp/100*130;
        el.waterUp.setAttribute('y',209-hUp);el.waterUp.setAttribute('height',Math.max(0,hUp));
        const hDown=8+S.levelDown/100*50;
        el.waterDown.setAttribute('y',680-hDown);el.waterDown.setAttribute('height',hDown);
        const dir=(S.mode==='pump')?-1:1,spin=Math.min(420,S.q*3.4);
        S.rot+=dir*spin*dt;el.rotor.setAttribute('transform',`rotate(${S.rot.toFixed(2)} 588 540)`);
        const pipeDir=(S.mode==='pump')?1:-1;
        S.flow+=pipeDir*Math.min(160,S.q*1.7)*dt;
        el.flowLine.setAttribute('stroke-dashoffset',S.flow.toFixed(2));
        el.flowLine.setAttribute('opacity',S.q>0.3?0.95:0.12);
        const cSpeed=Math.min(95,Math.abs(S.power)*2.4);
        S.cable+=((S.mode==='pump')?1:-1)*cSpeed*dt;
        el.cableFlow.setAttribute('stroke-dashoffset',S.cable.toFixed(2));
        if(S.mode==='pump'&&S.q>0.3){el.cableFlow.setAttribute('stroke','#ffa94d');el.cableFlow.setAttribute('opacity',1);}
        else if(S.power>0.2){el.cableFlow.setAttribute('stroke','#42e39b');el.cableFlow.setAttribute('opacity',1);}
        else{el.cableFlow.setAttribute('opacity',0.18);}
        el.sHead.textContent=S.head.toFixed(1)+' m';
        el.sFlow.textContent=S.q.toFixed(1)+' m³/s';
        el.sPower.textContent=(S.power>=0?'+':'−')+Math.abs(S.power).toFixed(1)+' MW';
        el.sEnergy.textContent=S.energy.toFixed(1)+' MWh';
        el.powerBox.classList.toggle('warn',S.power<-0.2);
        el.lvUp.textContent=S.levelUp.toFixed(1)+' %';
        el.lvDown.textContent=S.levelDown.toFixed(1)+' %';
        el.barUp.style.width=S.levelUp+'%';el.barDown.style.width=S.levelDown+'%';
        el.sTime.textContent=fmtTime(S.simTime);
      }
      let last=0;
      function loop(now){
        if(!last)last=now;let dt=(now-last)/1000;last=now;dt=Math.min(dt,0.06);
        step(dt);render(dt);requestAnimationFrame(loop);
      }
      document.querySelectorAll('.mode-btn').forEach(btn=>{
        btn.addEventListener('click',()=>setMode(btn.dataset.mode));
      });
      el.opening.addEventListener('input',e=>{
        S.opening=+e.target.value;el.openingVal.textContent=S.opening+' %';
        e.target.style.background=`linear-gradient(90deg,var(--cyan) 0%,var(--cyan) ${S.opening}%,#16293a ${S.opening}%,#16293a 100%)`;
      });
      el.opening.dispatchEvent(new Event('input'));
      el.auto.addEventListener('change',e=>{S.auto=e.target.checked;if(S.auto&&S.mode==='idle')setMode('turbine');});
      $('reset').addEventListener('click',()=>{
        S=initial();last=0;setMode('turbine');el.auto.checked=false;
        el.opening.value=60;el.opening.dispatchEvent(new Event('input'));render(0);
      });
      requestAnimationFrame(loop);
    })();
    </script>
  </template>

    <script>
    (function(){
      "use strict";
      const CAP_UP=600000,CAP_DOWN=900000,Q_MAX=42,ETA=.22,PHASE_DUR=[0.65,0.14,0.48,0.36],TIME_SCALE=180;
      const initial=()=>({running:true,levelUp:85,levelDown:10,opening:65,speed:1,cycles:0,volPumped:0,volDrive:0,
        simTime:0,phase:0,phaseTime:0,pressure:.15,driveFlow:0,pumpFlow:0,wasteFlow:0,driveDash:0,deliveryDash:0,
        wasteDash:0,gaugeAngle:-50,wasteOpen:1,deliveryOpen:0,hammerFlash:0});
      let S=initial();
      const $=id=>document.getElementById(id);
      const D={waterUp:$('waterUp'),waterDown:$('waterDown'),surfaceUp:$('surfaceUp'),surfaceDown:$('surfaceDown'),
        driveFlow:$('driveFlow'),deliveryFlow:$('deliveryFlow'),wasteFlow:$('wasteFlow'),pumpWater:$('pumpWater'),
        wasteFlap:$('wasteFlap'),deliveryBall:$('deliveryBall'),gaugeNeedle:$('gaugeNeedle'),airLevel:$('airLevel'),
        phaseLabel:$('phaseLabel'),sDrive:$('sDrive'),sPump:$('sPump'),sPress:$('sPress'),sCycles:$('sCycles'),
        sEff:$('sEff'),sVol:$('sVol'),lvUp:$('lvUp'),lvDown:$('lvDown'),barUp:$('barUp'),barDown:$('barDown'),
        sTime:$('sTime'),opening:$('opening'),openingVal:$('openingVal'),speed:$('speed'),speedVal:$('speedVal')};
      const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
      const lerp=(a,b,t)=>a+(b-a)*t;
      const fmtTime=s=>{const h=Math.floor(s/3600),m=Math.floor((s%3600)/60);return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');};
      function step(dt){
        if(!S.running){S.driveFlow*=.92;S.pumpFlow*=.92;S.wasteFlow*=.92;return;}
        S.phaseTime+=dt*S.speed;
        if(S.phaseTime>=PHASE_DUR[S.phase]){S.phaseTime-=PHASE_DUR[S.phase];S.phase=(S.phase+1)%4;if(S.phase===1){S.cycles++;S.hammerFlash=1;}}
        const of=S.opening/100,headFactor=.4+S.levelUp/100*.6;
        const qDrive=Q_MAX*of*headFactor,qPump=qDrive*ETA,qWaste=qDrive*(1-ETA);
        S.driveFlow=lerp(S.driveFlow,qDrive,Math.min(1,dt*6));
        S.pumpFlow=lerp(S.pumpFlow,qPump,Math.min(1,dt*6));
        S.wasteFlow=lerp(S.wasteFlow,qWaste,Math.min(1,dt*6));
        const dtSim=dt*TIME_SCALE;
        const volDrive=qDrive*dtSim,volPump=qPump*dtSim,volWaste=qWaste*dtSim;
        S.levelUp+=(-volDrive+volPump+(volDrive-volPump))/CAP_UP*100;
        S.levelDown+=volWaste/CAP_DOWN*100;
        S.levelUp=clamp(S.levelUp,2,100);S.levelDown=clamp(S.levelDown,2,98);
        S.volDrive+=volDrive;S.volPumped+=volPump;S.simTime+=dtSim;
        const tP=[.18,.92,.72,.32][S.phase];
        S.pressure=lerp(S.pressure,tP,Math.min(1,dt*18));
        const wT=[1,0,0,.55][S.phase],dT=[0,.75,1,0][S.phase];
        S.wasteOpen=lerp(S.wasteOpen,wT,Math.min(1,dt*22));
        S.deliveryOpen=lerp(S.deliveryOpen,dT,Math.min(1,dt*22));
        S.hammerFlash*=.88;
      }
      function render(dt){
        const hUp=S.levelUp/100*152;
        D.waterUp.setAttribute('y',200-hUp);D.waterUp.setAttribute('height',Math.max(0,hUp));
        D.surfaceUp.setAttribute('y1',200-hUp);D.surfaceUp.setAttribute('y2',200-hUp);
        const hDown=8+S.levelDown/100*104;
        D.waterDown.setAttribute('y',706-hDown);D.waterDown.setAttribute('height',hDown);
        D.surfaceDown.setAttribute('y1',706-hDown);D.surfaceDown.setAttribute('y2',706-hDown);
        S.driveDash-=(S.running?S.driveFlow*2.2:0)*dt*60;
        S.deliveryDash-=(S.running?S.pumpFlow*3.4:0)*dt*60;
        S.wasteDash-=(S.running?S.wasteFlow*2.6:0)*dt*60;
        D.driveFlow.setAttribute('stroke-dashoffset',S.driveDash.toFixed(1));
        D.deliveryFlow.setAttribute('stroke-dashoffset',S.deliveryDash.toFixed(1));
        D.wasteFlow.setAttribute('stroke-dashoffset',S.wasteDash.toFixed(1));
        D.driveFlow.setAttribute('opacity',S.running?clamp(.3+S.driveFlow/30,.2,1):.15);
        D.deliveryFlow.setAttribute('opacity',S.running?clamp(.2+S.pumpFlow/12,.15,1):.1);
        D.wasteFlow.setAttribute('opacity',S.running?clamp(.2+S.wasteFlow/30,.15,1):.1);
        const ph=90*(.55+S.pressure*.5);
        D.pumpWater.setAttribute('height',ph.toFixed(1));D.pumpWater.setAttribute('y',(620-ph).toFixed(1));
        D.wasteFlap.setAttribute('transform',`rotate(${(S.wasteOpen*38).toFixed(1)} 202 631)`);
        D.deliveryBall.setAttribute('cy',(522-S.deliveryOpen*9).toFixed(1));
        D.deliveryBall.setAttribute('fill',S.deliveryOpen>.5?'#42e39b':'url(#metalLight)');
        const targetAngle=-50+S.pressure*100;
        S.gaugeAngle=lerp(S.gaugeAngle,targetAngle,Math.min(1,dt*14));
        D.gaugeNeedle.setAttribute('transform',`rotate(${S.gaugeAngle.toFixed(1)} 320 462)`);
        D.airLevel.setAttribute('y',(470+(1-S.pressure)*20).toFixed(1));
        const names=['ACCÉLÉRATION','COUP DE BÉLIER','REFOULEMENT','DÉTENTE'];
        const colors=['#5fd0ff','#ffa94d','#42e39b','#7d9ab3'];
        D.phaseLabel.textContent=names[S.phase];
        D.phaseLabel.setAttribute('fill',colors[S.phase]);
        D.sDrive.textContent=S.driveFlow.toFixed(1)+' L/s';
        D.sPump.textContent=S.pumpFlow.toFixed(1)+' L/s';
        D.sPress.textContent=(S.pressure*6).toFixed(1)+' bar';
        D.sCycles.textContent=S.cycles;
        D.sVol.textContent=(S.volPumped/1000).toFixed(1)+' m³';
        D.sEff.textContent=(S.volDrive>0?(S.volPumped/S.volDrive*100):0).toFixed(1)+' %';
        D.lvUp.textContent=S.levelUp.toFixed(1)+' %';
        D.lvDown.textContent=S.levelDown.toFixed(1)+' %';
        D.barUp.style.width=S.levelUp+'%';D.barDown.style.width=S.levelDown+'%';
        D.sTime.textContent=fmtTime(S.simTime);
      }
      let last=0;
      function loop(now){
        if(!last)last=now;let dt=(now-last)/1000;last=now;dt=Math.min(dt,0.06);
        step(dt);render(dt);requestAnimationFrame(loop);
      }
      $('btnRun').addEventListener('click',()=>{S.running=true;$('btnRun').classList.add('active');$('btnStop').classList.remove('active');});
      $('btnStop').addEventListener('click',()=>{S.running=false;$('btnStop').classList.add('active');$('btnRun').classList.remove('active');});
      D.opening.addEventListener('input',e=>{
        S.opening=+e.target.value;D.openingVal.textContent=S.opening+' %';
        e.target.style.background=`linear-gradient(90deg,var(--cyan) 0%,var(--cyan) ${S.opening}%,#16293a ${S.opening}%,#16293a 100%)`;
      });
      D.opening.dispatchEvent(new Event('input'));
      D.speed.addEventListener('input',e=>{
        S.speed=+e.target.value;D.speedVal.textContent=S.speed.toFixed(1)+'×';
        const pct=(S.speed-.2)/2.3*100;
        e.target.style.background=`linear-gradient(90deg,var(--cyan) 0%,var(--cyan) ${pct}%,#16293a ${pct}%,#16293a 100%)`;
      });
      D.speed.dispatchEvent(new Event('input'));
      $('reset').addEventListener('click',()=>{
        S=initial();last=0;$('btnRun').classList.add('active');$('btnStop').classList.remove('active');
        D.opening.value=65;D.opening.dispatchEvent(new Event('input'));
        D.speed.value=1;D.speed.dispatchEvent(new Event('input'));render(0);
      });
      requestAnimationFrame(loop);
    })();
    </script>

    <script>
    (function(){
      "use strict";
      const H_REAL=50,C_FLOW=22,TIME_SCALE=60;
      const initial=()=>({running:true,levelA:88,levelB:88,load1:.65,load2:.5,q1:0,q2:0,p1:0,p2:0,energy:0,simTime:0,dash1:0,dash2:0,cable1:0,rot1:0,rot2:0});
      let S=initial();
      const $=id=>document.getElementById(id);
      const D={waterA:$('waterA'),waterB:$('waterB'),surfA:$('surfA'),surfB:$('surfB'),flow1:$('flow1'),flow2:$('flow2'),
        cable1:$('cable1'),rotor1:$('rotor1'),rotor2:$('rotor2'),powerBig:$('powerBig'),sP1:$('sP1'),sP2:$('sP2'),
        sPnet:$('sPnet'),sQ:$('sQ'),sE:$('sE'),lvA:$('lvA'),lvB:$('lvB'),barA:$('barA'),barB:$('barB'),sTime:$('sTime'),
        load1:$('load1'),load2:$('load2'),load1Val:$('load1Val'),load2Val:$('load2Val'),eff1:$('eff1'),eff2:$('eff2')};
      const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
      const lerp=(a,b,t)=>a+(b-a)*t;
      const fmtTime=s=>{const h=Math.floor(s/3600),m=Math.floor((s%3600)/60);return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');};
      function step(dt){
        if(!S.running)return;
        const h=Math.max(1,S.levelA/100*H_REAL);
        const target=C_FLOW*Math.sqrt(h/H_REAL)*(1+0.06*Math.sin(S.simTime*0.25));
        S.q1=lerp(S.q1,target,Math.min(1,dt*2));
        S.q2=lerp(S.q2,S.q1,Math.min(1,dt*1.2));
        const eta1=Math.max(.05,.92*Math.sin(Math.PI*S.load1));
        const eta2=Math.max(.05,.85*Math.sin(Math.PI*S.load2));
        S.p1=9.81*(S.q1/1000)*h*eta1;
        S.p2=9.81*(S.q2/1000)*h*(1/eta2)*0.55;
        const dtSim=dt*TIME_SCALE,d=(S.q2-S.q1)*dtSim;
        S.levelA=clamp(S.levelA+d/1000000*100,5,100);
        S.levelB=clamp(S.levelB-d/1000000*100,5,100);
        S.energy+=(S.p1-S.p2)*dtSim/3600;
        S.simTime+=dtSim;
      }
      function render(dt){
        const yA=660-S.levelA/100*400;
        D.waterA.setAttribute('y',yA.toFixed(1));D.waterA.setAttribute('height',(660-yA).toFixed(1));
        D.surfA.setAttribute('y1',yA.toFixed(1));D.surfA.setAttribute('y2',yA.toFixed(1));
        const yB=660-S.levelB/100*400;
        D.waterB.setAttribute('y',yB.toFixed(1));D.waterB.setAttribute('height',(660-yB).toFixed(1));
        D.surfB.setAttribute('y1',yB.toFixed(1));D.surfB.setAttribute('y2',yB.toFixed(1));
        S.dash1-=S.q1*0.5*dt*60;S.dash2-=S.q2*0.5*dt*60;
        D.flow1.setAttribute('stroke-dashoffset',S.dash1.toFixed(1));
        D.flow2.setAttribute('stroke-dashoffset',S.dash2.toFixed(1));
        D.flow1.setAttribute('opacity',clamp(.15+S.q1/5,.15,1));
        D.flow2.setAttribute('opacity',clamp(.15+S.q2/5,.15,1));
        S.rot1+=Math.min(720,S.q1*6)*dt;S.rot2-=Math.min(720,S.q2*6)*dt;
        D.rotor1.setAttribute('transform',`rotate(${S.rot1.toFixed(1)} 450 535)`);
        D.rotor2.setAttribute('transform',`rotate(${S.rot2.toFixed(1)} 450 645)`);
        S.cable1-=(S.p1>0.01?1:0)*60*dt;
        D.cable1.setAttribute('stroke-dashoffset',S.cable1.toFixed(1));
        D.cable1.setAttribute('opacity',clamp(.4+S.p1/40,.4,1));
        const pnet=S.p1-S.p2;
        D.sP1.textContent=S.p1.toFixed(2)+' kW';
        D.sP2.textContent=S.p2.toFixed(2)+' kW';
        D.sPnet.textContent=pnet.toFixed(2)+' kW';
        D.powerBig.textContent=pnet.toFixed(1)+' kW';
        D.powerBig.setAttribute('fill',pnet>0.5?'#ffffff':'#ff8a80');
        D.sQ.textContent=((S.q1+S.q2)/2).toFixed(1)+' L/s';
        D.sE.textContent=S.energy.toFixed(3)+' kWh';
        D.lvA.textContent=S.levelA.toFixed(1)+' %';
        D.lvB.textContent=S.levelB.toFixed(1)+' %';
        D.barA.style.width=S.levelA+'%';D.barB.style.width=S.levelB+'%';
        D.sTime.textContent=fmtTime(S.simTime);
        const eta1=Math.max(.05,.92*Math.sin(Math.PI*S.load1));
        const eta2=Math.max(.05,.85*Math.sin(Math.PI*S.load2));
        D.eff1.textContent=(eta1*100).toFixed(0)+' %';
        D.eff2.textContent=(eta2*100).toFixed(0)+' %';
      }
      let last=0;
      function loop(now){
        if(!last)last=now;let dt=(now-last)/1000;last=now;dt=Math.min(dt,0.05);
        step(dt);render(dt);requestAnimationFrame(loop);
      }
      $('btnPause').addEventListener('click',e=>{
        S.running=!S.running;
        e.currentTarget.textContent=S.running?'⏸ Pause':'▶ Reprendre';
      });
      $('reset').addEventListener('click',()=>{
        S=initial();last=0;$('btnPause').textContent='⏸ Pause';
        D.load1.value=65;D.load2.value=50;
        D.load1.dispatchEvent(new Event('input'));
        D.load2.dispatchEvent(new Event('input'));render(0);
      });
      D.load1.addEventListener('input',e=>{
        S.load1=+e.target.value/100;D.load1Val.textContent=e.target.value+' %';
        const p=e.target.value;
        e.target.style.background=`linear-gradient(90deg,#4d9fff 0%,#4d9fff ${p}%,#16293a ${p}%,#16293a 100%)`;
      });
      D.load1.dispatchEvent(new Event('input'));
      D.load2.addEventListener('input',e=>{
        S.load2=+e.target.value/100;D.load2Val.textContent=e.target.value+' %';
        const p=e.target.value;
        e.target.style.background=`linear-gradient(90deg,#ff5252 0%,#ff5252 ${p}%,#16293a ${p}%,#16293a 100%)`;
      });
      D.load2.dispatchEvent(new Event('input'));
      requestAnimationFrame(loop);
    })();
    </script>
  </template>

              <line x1="430" y1="${cross?339:yT}" x2="470" y2="${cross?339:yT}" stroke="#5fd0ff" stroke-width="4" stroke-linecap="round"/>
            </g>
            <text x="450" y="${(cross?339:yT)-34}" text-anchor="middle" font-size="9.5" font-weight="700" fill="#5fd0ff" letter-spacing="1.2">TURBINE T1 · A → B</text>
          </g>
          ${lineB}
          <g>
            <rect x="${cross?422:398}" y="${cross?470:554}" width="104" height="88" rx="14" fill="#3d4f61" stroke="#0a121a" stroke-width="3"/>
            <circle cx="450" cy="${cross?514:yP}" r="27" fill="#0a1520" stroke="${CFG.col2}" stroke-width="3"/>
            <g id="rotorP">
              <line x1="450" y1="${(cross?514:yP)-19}" x2="450" y2="${(cross?514:yP)+19}" stroke="${CFG.col2}" stroke-width="5" stroke-linecap="round"/>
              <line x1="431" y1="${cross?514:yP}" x2="469" y2="${cross?514:yP}" stroke="${CFG.col2}" stroke-width="5" stroke-linecap="round"/>
            </g>
            <text x="${cross?474:450}" y="${cross?586:686}" text-anchor="middle" font-size="10" font-weight="700" fill="${CFG.col2}" letter-spacing="1.4">${CFG.title2} · B → A</text>
          </g>
        </svg>
        </div>
        <aside class="panel">
          <div class="card">
            <h2>Contrôles</h2>
            <div class="btn-row">
              <button class="btn active" id="btnPause">⏸ Pause</button>
              <button class="reset" id="reset" style="width:auto;flex:1">↺ Réinitialiser</button>
            </div>
          </div>
          <div class="card">
            <h2>Débit de circulation</h2>
            <input type="range" id="qSet" min="0" max="100" value="60">
            <div class="range-row"><span>0</span><b id="qVal">60 %</b><span>100</span></div>
          </div>
          <div class="card">
            <h2>Bilan énergétique</h2>
            <div class="stats">
              <div class="stat hl"><span>P turbine (produit)</span><b id="sP1">0.00 kW</b></div>
              <div class="stat or"><span>P ${CFG.ram?"bélier":"pompe"} (consommé)</span><b id="sP2">0.00 kW</b></div>
              <div class="stat ${CFG.pumpPower<0.6?"gr":"rd"}" style="grid-column:1/-1"><span>Puissance nette</span><b id="sPnet" style="font-size:18px">0.00 kW</b></div>
              <div class="stat"><span>Q réseau haut</span><b id="sQ1">0 L/s</b></div>
              <div class="stat gr"><span>Q refoulé B→A</span><b id="sQ2">0 L/s</b></div>
            </div>
          </div>
          <div class="card">
            <h2>Niveaux</h2>
            <div class="level"><div class="level-head"><span>▲ Réservoir A</span><b id="lvA">80 %</b></div><div class="bar"><i id="barA" style="width:80%"></i></div></div>
            <div class="level"><div class="level-head"><span>▲ Réservoir B</span><b id="lvB">80 %</b></div><div class="bar right"><i id="barB" style="width:80%"></i></div></div>
            <div class="simtime"><span>Temps simulé</span><b id="sTime">00:00</b></div>
          </div>
          <div class="info ${CFG.pumpPower<0.6?"ok":""}"><span class="ic">INFO</span>${CFG.msg}</div>
        </aside>`;
      const $=id=>document.getElementById(id);
      const D={waterA:$('waterA'),waterB:$('waterB'),surfA:$('surfA'),surfB:$('surfB'),flowT:$('flowT'),flowB:$('flowB'),
        rotorT:$('rotorT'),rotorP:$('rotorP'),sP1:$('sP1'),sP2:$('sP2'),sPnet:$('sPnet'),sQ1:$('sQ1'),sQ2:$('sQ2'),
        lvA:$('lvA'),lvB:$('lvB'),barA:$('barA'),barB:$('barB'),sTime:$('sTime')};
      const CAP=1000000,H=12,TS=60;
      const S={run:true,lA:80,lB:80,q:45,qSet:.6,p1:0,p2:0,t:0,d1:0,d2:0,r1:0,r2:0};
      const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
      const fmt=s=>{const h=Math.floor(s/3600),m=Math.floor((s%3600)/60);return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');};
      const ramRatio=()=>0.20;
      function step(dt){
        if(!S.run)return;
        S.q=45*S.qSet;
        const dtSim=dt*TS;
        const q2=CFG.ram?S.q*ramRatio():(mode==="closed"||mode==="cross")?S.q*0.98:S.q;
        const h=Math.max(1,Math.min(S.lA,S.lB)/100*H);
        S.p1=9.81*(S.q/1000)*h*0.9;
        S.p2=CFG.ram?0:9.81*(q2/1000)*h/0.85*(CFG.ram?1:CFG.pumpPower);
        if(CFG.ram)S.p2=0;
        const dA=(q2-S.q)*dtSim, dB=(S.q-q2)*dtSim;
        S.lA=clamp(S.lA+dA/CAP*100,2,100);
        S.lB=clamp(S.lB+dB/CAP*100,2,100);
        S.t+=dtSim;
        S.d1-=S.q*0.4*dt*60; S.d2-=q2*0.5*dt*60;
        S.r1+=Math.min(500,S.q*5)*dt; S.r2-=Math.min(500,q2*5)*dt;
      }
      function render(){
        const yA=466-S.lA/100*232,yB=466-S.lB/100*232;
        D.waterA.setAttribute('y',yA);D.waterA.setAttribute('height',466-yA);
        D.waterB.setAttribute('y',yB);D.waterB.setAttribute('height',466-yB);
        D.surfA.setAttribute('y1',yA);D.surfA.setAttribute('y2',yA);
        D.surfB.setAttribute('y1',yB);D.surfB.setAttribute('y2',yB);
        D.flowT.setAttribute('stroke-dashoffset',S.d1.toFixed(1));
        D.flowB.setAttribute('stroke-dashoffset',S.d2.toFixed(1));
        const cy=cross?339:339;
        D.rotorT.setAttribute('transform',`rotate(${S.r1.toFixed(1)} 450 ${cy})`);
        D.rotorP.setAttribute('transform',`rotate(${S.r2.toFixed(1)} 450 ${cross?514:599})`);
        const net=S.p1-S.p2;
        D.sP1.textContent=S.p1.toFixed(2)+' kW';
        D.sP2.textContent=S.p2.toFixed(2)+' kW';
        D.sPnet.textContent=net.toFixed(2)+' kW';
        D.sQ1.textContent=S.q.toFixed(1)+' L/s';
        D.sQ2.textContent=(CFG.ram?S.q*ramRatio():(mode==="closed"||mode==="cross")?S.q*0.98:S.q).toFixed(1)+' L/s';
        D.lvA.textContent=S.lA.toFixed(1)+' %';
        D.lvB.textContent=S.lB.toFixed(1)+' %';
        D.barA.style.width=S.lA+'%';D.barB.style.width=S.lB+'%';
        D.sTime.textContent=fmt(S.t);
      }
      let last=0;
      function loop(now){
        if(!last)last=now;let dt=(now-last)/1000;last=now;dt=Math.min(dt,0.05);
        step(dt);render();requestAnimationFrame(loop);
      }
      $('btnPause').addEventListener('click',e=>{S.run=!S.run;e.currentTarget.textContent=S.run?'⏸ Pause':'▶ Reprendre';});
      $('reset').addEventListener('click',()=>{S.lA=80;S.lB=80;S.t=0;S.qSet=.6;$('qSet').value=60;$('qSet').dispatchEvent(new Event('input'));});
      $('qSet').addEventListener('input',e=>{
        S.qSet=+e.target.value/100;$('qVal').textContent=e.target.value+' %';
        const p=e.target.value;
        e.target.style.background=`linear-gradient(90deg,var(--cyan) 0%,var(--cyan) ${p}%,#16293a ${p}%,#16293a 100%)`;
      });
      $('qSet').dispatchEvent(new Event('input'));
      requestAnimationFrame(loop);
    })();
  }
  </script>

  <script>
  /* ================================================================
     GESTION DES ONGLETS · injection des templates dans des iframes
     ================================================================ */
  (function(){
    "use strict";
    const COMMON_CSS = `
      html,body{height:100%}
      body{margin:0;font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
        background:radial-gradient(1200px 700px at 15% -10%,#14304a 0%,#08111c 55%,#04080d 100%);
        color:#dbe7f3;-webkit-font-smoothing:antialiased;
        --cyan:#5fd0ff;--green:#42e39b;--orange:#ffa94d;--muted:#7d9ab3;
        --line:#1f3a52;--panel:#0e1a26;--panel-2:#132435}
      .wrap{max-width:1600px;margin:0 auto;padding:16px 20px 26px}
      header{margin-bottom:14px}.brand{display:flex;align-items:center;gap:14px}
      .logo{width:46px;height:46px;flex:0 0 46px;display:grid;place-items:center;border-radius:14px;
        background:linear-gradient(150deg,#12384f,#0b1d2c);border:1px solid #2b5270;font-size:23px;
        box-shadow:0 0 24px rgba(95,208,255,.22)}
      h1{margin:0;font-size:18px;font-weight:700}header p{margin:3px 0 0;font-size:12.5px;color:var(--muted)}
      .layout{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:16px;align-items:start}
      @media(max-width:1180px){.layout{grid-template-columns:1fr}}
      .stage{background:linear-gradient(180deg,#0b1522,#08111b);border:1px solid var(--line);
        border-radius:20px;padding:8px;box-shadow:0 24px 70px rgba(0,0,0,.55)}
      .stage svg{display:block;width:100%;height:auto;border-radius:14px}
      .panel{display:flex;flex-direction:column;gap:12px}
      .card{background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--line);
        border-radius:16px;padding:13px 15px}
      .card h2{margin:0 0 10px;font-size:10.5px;text-transform:uppercase;letter-spacing:.14em;
        color:var(--muted);font-weight:700}
      .btn-row{display:flex;gap:8px}
      .btn,.reset{padding:11px;border-radius:12px;border:1px solid var(--line);background:#0b1725;
        color:var(--muted);font:600 12.5px 'Inter',system-ui,sans-serif;cursor:pointer;transition:all .18s;width:100%}
      .btn:hover,.reset:hover{border-color:#2e5c7d;color:#dbe7f3}
      .btn.active{border-color:#5fd0ff;color:#5fd0ff}
      .btn.stop.active{border-color:#ff6b6b;color:#ff6b6b}
      input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:6px;border-radius:6px;
        background:#16293a;outline:none;cursor:pointer;margin-top:4px}
      input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;
        background:#eaf7ff;border:3px solid var(--cyan);box-shadow:0 0 12px rgba(95,208,255,.6);cursor:grab}
      input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#eaf7ff;
        border:3px solid var(--cyan);cursor:grab}
      .range-row{display:flex;justify-content:space-between;align-items:center;margin-top:6px;
        font-size:11px;color:#57748c}
      .range-row b{font-size:13px;color:var(--cyan);font-variant-numeric:tabular-nums}
      .stats{display:grid;grid-template-columns:1fr 1fr;gap:7px}
      .stat{background:#0a1420;border:1px solid #16293a;border-radius:12px;padding:8px 10px}
      .stat span{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.09em;
        color:var(--muted);margin-bottom:3px}
      .stat b{font-size:14.5px;font-weight:700;font-variant-numeric:tabular-nums}
      .stat.hl b{color:var(--cyan)}.stat.gr b{color:var(--green)}.stat.or b{color:var(--orange)}.stat.rd b{color:#ff6b6b}
      .stat.warn b{color:var(--orange)!important}
      .level{margin-bottom:10px}.level-head{display:flex;justify-content:space-between;font-size:11.5px;
        color:var(--muted);margin-bottom:5px}
      .level-head b{color:#dbe7f3;font-variant-numeric:tabular-nums}
      .bar{height:9px;border-radius:9px;background:#0a1622;border:1px solid #16293a;overflow:hidden}
      .bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#1a7fb8,#5fd0ff);
        box-shadow:0 0 12px rgba(95,208,255,.45);transition:width .1s linear}
      .bar.down i,.bar.right i{background:linear-gradient(90deg,#15688f,#3ba9d8)}
      .simtime{margin-top:10px;padding-top:9px;border-top:1px solid #16293a;font-size:11.5px;
        color:var(--muted);display:flex;justify-content:space-between}
      .simtime b{color:#dbe7f3;font-variant-numeric:tabular-nums}
      .info{background:linear-gradient(135deg,#0a1f2e,#0d1824);border:1px solid #1a3a52;border-radius:14px;
        padding:11px 13px;font-size:11px;line-height:1.55;color:#8fb0c8}
      .info b{color:var(--cyan)}
      .info .ic{display:inline-block;background:var(--cyan);color:#04121c;font-size:9px;font-weight:800;
        padding:1px 6px;border-radius:6px;margin-right:5px;letter-spacing:.05em}
      .info.ok{background:linear-gradient(135deg,#0a2a1e,#0d2419);border-color:#1a4a32;color:#9fd4b8}
      .info.ok b{color:var(--green)}.info.ok .ic{background:var(--green);color:#021a0e}
      .modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
      .mode-btn{padding:11px 6px;border-radius:12px;border:1px solid var(--line);background:#0b1725;
        color:var(--muted);font:600 12.5px 'Inter',system-ui,sans-serif;cursor:pointer}
      .mode-btn.active{border-color:#5fd0ff;color:#5fd0ff;background:#0d2537}
      .mode-btn.wide{grid-column:1/-1}
      .switch{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);cursor:pointer}
      #rotor,#rotorT,#rotorP,#rotorTurb,#rotorPump,#rotor1,#rotor2{transform-box:fill-box;transform-origin:center}
      .pulse{animation:pulse 2s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
    `;
    const frames=document.getElementById('frames');
    const tabs=[...document.querySelectorAll('.tab')];
    const made={};
    function show(i){
      tabs.forEach(t=>t.classList.toggle('active',+t.dataset.tab===i));
      for(const k in made) made[k].hidden=(+k!==i);
      if(made[i])return;
      const tpl=document.getElementById('tpl-'+i);
      const f=document.createElement('iframe');
      f.className='sim-frame';
      f.srcdoc='<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><style>'+COMMON_CSS+'</style></head><body>'+tpl.innerHTML+'</body></html>';
      frames.appendChild(f);
      made[i]=f;
    }
    tabs.forEach(t=>t.addEventListener('click',()=>show(+t.dataset.tab)));
    show(0);
  })();
  </script>
